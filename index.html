<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قرار الشراء</title>
<meta name="theme-color" content="#4338ca">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="قرار الشراء">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5fb; --card:#ffffff; --ink:#1e1b4b; --muted:#6b6a85; --line:#e4e2f0;
  --brand:#4338ca; --brand-soft:#e0e7ff; --gold:#f59e0b; --gold-soft:#fef3c7;
  --ok:#059669; --wait:#d97706; --no:#e11d48;
  --ok-soft:#d1fae5; --wait-soft:#fef3c7; --no-soft:#ffe4e6;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f0e1f; --card:#1a1832; --ink:#eeedfb; --muted:#a3a1c2; --line:#2c2a4a;
    --brand:#818cf8; --brand-soft:#2a2766; --gold:#fbbf24; --gold-soft:#3b2a05;
    --ok:#34d399; --wait:#fbbf24; --no:#fb7185;
    --ok-soft:#073b2c; --wait-soft:#3b2a05; --no-soft:#4a0d1f;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',system-ui,sans-serif;font-size:17px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
h1{font-size:24px;font-weight:800;margin:0}
h1 span{color:var(--brand)}
.link{background:none;border:0;color:var(--brand);font:inherit;font-size:15px;cursor:pointer;padding:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 18px;margin-bottom:14px}
.screen{display:none}.screen.on{display:block}
label{display:block;font-weight:700;margin-bottom:6px}
.hint{color:var(--muted);font-size:14px;margin:0 0 14px}
input{width:100%;font:inherit;font-size:20px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);direction:ltr;text-align:right}
input:focus{outline:none;border-color:var(--brand)}
.field{margin-bottom:16px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:700;font-size:18px;cursor:pointer;background:var(--brand);color:#fff}
@media (prefers-color-scheme: dark){.btn{color:#0f0e1f}}
.num{unicode-bidi:isolate;direction:ltr;display:inline-block}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px}.row .btn{flex:1}
/* رحلة البوابات */
.journey{position:relative;display:flex;justify-content:space-between;margin:4px 6px 6px}
.journey .track,.journey .fill{position:absolute;top:22px;right:22px;left:22px;height:4px;border-radius:4px;background:var(--line)}
.journey .fill{background:linear-gradient(to left,var(--brand),var(--gold));left:auto;width:0;transition:width .45s cubic-bezier(.3,1.4,.5,1)}
.node{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;width:48px}
.node .dot{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:21px;background:var(--card);border:2.5px solid var(--line);filter:grayscale(1);opacity:.55;transition:all .3s}
.node small{margin-top:4px;font-size:12px;color:var(--muted);font-weight:700}
.node.done .dot{background:var(--brand);border-color:var(--brand);filter:none;opacity:1}
.node.done small{color:var(--brand)}
.node.now .dot{border-color:var(--gold);background:var(--gold-soft);filter:none;opacity:1;transform:scale(1.12);animation:pulse 1.6s infinite}
.node.now small{color:var(--ink)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,158,11,.5)}70%{box-shadow:0 0 0 12px rgba(245,158,11,0)}100%{box-shadow:0 0 0 0 rgba(245,158,11,0)}}
.steps{display:flex;justify-content:center;gap:6px;margin:12px 0 10px}
.steps i{width:28px;height:6px;border-radius:6px;background:var(--line);transition:background .3s}
.steps i.on{background:var(--gold)}
.steps i.cur{background:var(--brand)}
.qcard{animation:slideIn .3s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-80px);background:var(--brand);color:#fff;padding:10px 18px;border-radius:30px;font-weight:700;font-size:15px;transition:transform .35s cubic-bezier(.3,1.4,.5,1);z-index:9;white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
.edit-badge{background:var(--gold-soft);color:var(--wait);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700;margin-bottom:12px}
.hist li .acts{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.hist .ed{background:none;border:1px solid var(--line);color:var(--brand);font:inherit;font-size:13px;padding:2px 10px;border-radius:10px;cursor:pointer}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:12px}
.gate{display:inline-block;background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:13px;padding:3px 10px;border-radius:20px;margin-bottom:10px}
.q{font-size:21px;font-weight:700;margin:0 0 6px}
.info{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:15px;margin:10px 0 14px}
.info b{color:var(--brand)}
.opts{display:grid;gap:10px}
.opt{text-align:right;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:17px;padding:14px 16px;border-radius:14px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--brand)}
.opt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.opt .cost{color:var(--brand);font-weight:700;font-size:15px}
.opt.sel{border-color:var(--brand);background:var(--brand-soft);font-weight:700}
.verdict{text-align:center;border-radius:18px;padding:24px 16px;margin-bottom:14px}
.verdict .ic{font-size:44px;line-height:1}
.verdict h2{margin:8px 0 2px;font-size:26px}
.verdict .score{font-size:16px;opacity:.85}
.v-ok{background:var(--ok-soft);color:var(--ok)}
.v-wait{background:var(--wait-soft);color:var(--wait)}
.v-no{background:var(--no-soft);color:var(--no)}
.gates{display:grid;gap:12px}
.g-row .top{display:flex;justify-content:space-between;font-size:15px;margin-bottom:4px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.facts div{background:var(--bg);border-radius:12px;padding:10px 4px}
.facts b{display:block;font-size:18px}
.facts small{color:var(--muted);font-size:12px}
.tip{border-right:4px solid var(--brand);padding:4px 12px;margin:0}
.reason{color:var(--no);font-weight:700}
h3{margin:0 0 12px;font-size:17px}
.hist{list-style:none;padding:0;margin:0}
.hist li{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.hist li:last-child{border:0}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:12px;white-space:nowrap}
.empty{color:var(--muted);font-size:15px;text-align:center;margin:0}
.income-pill{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:15px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🛒 قرار <span>الشراء</span></h1>
    <button class="link" id="histBtn" type="button">السجل</button>
  </header>

  <!-- 1. الدخل -->
  <section class="screen" id="s-income">
    <div class="card">
      <label for="income">دخلك الشهري (دج)</label>
      <p class="hint">يُحفظ على هاتفك فقط، ولا يُرسل إلى أي مكان. تُدخله مرة واحدة.</p>
      <div class="field"><input id="income" type="number" inputmode="numeric" min="0" placeholder="مثال: 60000"></div>
      <label for="hours">ساعات العمل في الشهر</label>
      <p class="hint">إذا لم تعرف، اتركها 176 (8 ساعات × 22 يوماً).</p>
      <div class="field"><input id="hours" type="number" inputmode="numeric" min="1" value="176"></div>
      <button class="btn" id="saveIncome" type="button">حفظ والمتابعة</button>
    </div>
  </section>

  <!-- 2. المنتج -->
  <section class="screen" id="s-item">
    <div class="income-pill"><span>الدخل الشهري: <b id="incomeShow"></b></span><button class="link" id="editIncome" type="button">تعديل</button></div>
    <div class="card">
      <div class="edit-badge" id="editBadge" hidden>✏️ تعديل قرار سابق: غيّر الثمن أو الإجابات حسب ظروفك الجديدة</div>
      <div class="field"><label for="itemName">ماذا تريد أن تشتري؟</label><input id="itemName" type="text" placeholder="مثال: هاتف جديد" style="direction:rtl;text-align:right"></div>
      <div class="field"><label for="price">ثمنه (دج)</label><input id="price" type="number" inputmode="numeric" min="0" placeholder="0"></div>
      <button class="btn" id="startQ" type="button">ابدأ الأسئلة</button>
    </div>
  </section>

  <!-- 3. الأسئلة -->
  <section class="screen" id="s-q">
    <div class="journey" id="journey">
      <div class="track"></div><div class="fill" id="jFill"></div>
      <div class="node"><div class="dot">🎯</div><small>الحاجة</small></div>
      <div class="node"><div class="dot">💰</div><small>القدرة</small></div>
      <div class="node"><div class="dot">⚖️</div><small>القيمة</small></div>
      <div class="node"><div class="dot">🧠</div><small>الدافع</small></div>
    </div>
    <div class="steps" id="steps"></div>
    <div class="meta"><span id="qCount"></span><span id="qItem"></span></div>
    <div class="card qcard" id="qCard">
      <span class="gate" id="qGate"></span>
      <p class="q" id="qText"></p>
      <div id="qInfo"></div>
      <div class="opts" id="qOpts"></div>
    </div>
    <div class="row">
      <button class="btn ghost" id="backQ" type="button">السابق</button>
    </div>
  </section>

  <!-- 4. النتيجة -->
  <section class="screen" id="s-res">
    <div class="verdict" id="verdict"></div>
    <div class="card"><h3>الأرقام</h3><div class="facts" id="facts"></div></div>
    <div class="card"><h3>البوابات</h3><div class="gates" id="gates"></div></div>
    <div class="card"><h3>نصيحة</h3><p class="tip" id="tip"></p></div>
    <div class="row">
      <button class="btn" id="again" type="button">قرار جديد</button>
    </div>
  </section>

  <!-- 5. السجل -->
  <section class="screen" id="s-hist">
    <div class="card"><h3>قراراتك السابقة</h3><ul class="hist" id="histList"></ul></div>
    <div class="row">
      <button class="btn ghost" id="closeHist" type="button">رجوع</button>
      <button class="btn ghost" id="clearHist" type="button">مسح السجل</button>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
const GATES = [
  {name:'الحاجة', max:30},
  {name:'القدرة', max:30},
  {name:'القيمة', max:25},
  {name:'الدافع', max:15}
];
const TIPS = [
  'الحاجة ضعيفة: اسأل نفسك هل يحل مشكلة حقيقية، أم يمكنك الإصلاح أو الاستعارة أو الاستئجار؟',
  'القدرة ضعيفة: خطّط له في ميزانية الشهر القادم وادّخر ثمنه أولاً بدل اقتطاعه من بند آخر.',
  'القيمة ضعيفة: قارن بين 3 محلات وفكّر في المستعمل، واحسب التكاليف الخفية قبل القرار.',
  'الدافع ضعيف: انتظر 72 ساعة. إذا كان الدافع تخفيضاً أو مزاجاً فغالباً ستخفّ الرغبة.'
];
// gate index, question, options [label, points]; knock=true => "لا تشترِ" فوراً
const QS = [
  {g:0, id:'need',   t:'هل يحل مشكلة حقيقية أعيشها الآن؟', o:[['نعم',10],['نوعاً ما',5],['لا',0]]},
  {g:0, id:'search', t:'لو لم أره اليوم، هل كنت سأبحث عنه؟', o:[['نعم',10],['لا',0]]},
  {g:0, t:'هل أملك شيئاً يؤدي نفس الغرض؟', o:[['لا',10],['بديل جزئي',5],['نعم',0]]},
  {g:1, id:'cash',   t:'هل أدفع ثمنه نقداً دون أن أمس الادخار أو أستدين؟', o:[['نعم',10],['لا',0,true]]},
  {g:1, t:'هل يستحق ساعات العمل التي يكلّفها؟', info:'hours', o:[['نعم',10],['متردد',5],['لا',0]]},
  {g:1, t:'هل هو مخطط له في ميزانية هذا الشهر؟', o:[['نعم',10],['سأقتطعه من بند آخر',5],['لا',0]]},
  {g:2, id:'use',    t:'كم مرة سأستعمله؟', o:[['يومياً',10,false,365],['أسبوعياً',10,false,52],['شهرياً',5,false,12],['نادراً',0,false,2]]},
  {g:2, id:'life',   t:'كم سنة تتوقع أن تستعمله؟', info:'use', o:[['أقل من سنة',0,false,0.5],['سنة',0,false,1],['3 سنوات',0,false,3],['5 سنوات أو أكثر',0,false,5]]},
  {g:2, t:'هل له تكاليف خفية (صيانة، اشتراك، وقود، قطع غيار)؟', o:[['لا أو قليلة',8],['متوسطة',4],['كبيرة',0]]},
  {g:2, t:'هل قارنت الأسعار والبدائل (محلات أخرى، المستعمل)؟', o:[['نعم',7],['لا',0]]},
  {g:3, t:'ما دافعي للشراء الآن؟', o:[['حاجة فعلية',5],['تخفيض أو عرض',0],['تأثير الآخرين',0],['مزاج (ملل، حزن، مكافأة)',0]]},
  {g:3, t:'هل سأظل راضياً عنه بعد شهر؟', o:[['نعم',5],['لست متأكداً',2],['لا',0]]},
  {g:3, t:'انتظرت 72 ساعة وما زلت أريده؟', o:[['نعم',5],['لم أنتظر بعد',2],['خفّت الرغبة',0]]}
];

const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
let profile = store.get('qarar_profile', null);
let item = {name:'', price:0};
let answers = [];
let cur = 0;
let prevScreen = 's-item';

const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
// الأرقام تُعزل باتجاه يسار→يمين حتى لا ينقلب ترتيبها داخل النص العربي
const iso = s => '<bdi class="num">' + s + '</bdi>';
const fmt = n => iso(Math.round(n).toLocaleString('en-US'));
const dec = n => iso((Math.round(n*10)/10).toLocaleString('en-US'));
const pct = n => iso((Math.round(n*10)/10).toLocaleString('en-US') + '%');
const ratio = (a,b) => iso(a) + ' من ' + iso(b);
let editId = null;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('on'),1600); }
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on', s.id===id)); window.scrollTo(0,0); }

function hourly(){ return profile.income / profile.hours; }
function workHours(){ return item.price / hourly(); }
function hoursText(){
  const h = workHours();
  if (h < 1) return fmt(h*60) + ' دقيقة';
  if (h < profile.hours/22*2) return dec(h) + ' ساعة';
  return fmt(h) + ' ساعة، أي ' + dec(h/(profile.hours/22)) + ' يوم عمل';
}

// الدخل
function initIncome(){
  if (profile){ $('income').value = profile.income; $('hours').value = profile.hours; }
  show('s-income');
}
$('saveIncome').onclick = () => {
  const inc = +$('income').value, hrs = +$('hours').value || 176;
  if (!inc || inc <= 0){ $('income').focus(); return; }
  profile = {income:inc, hours:hrs};
  store.set('qarar_profile', profile);
  goItem();
};
function goItem(prefill){
  $('incomeShow').innerHTML = fmt(profile.income) + ' دج';
  editId = prefill ? prefill.id : null;
  $('editBadge').hidden = !prefill;
  $('itemName').value = prefill ? prefill.n : '';
  $('price').value = prefill ? prefill.p : '';
  $('startQ').textContent = prefill ? 'راجع الإجابات' : 'ابدأ الأسئلة';
  item.prev = prefill && prefill.a ? prefill.a : null;
  show('s-item');
}
$('editIncome').onclick = initIncome;

// المنتج
$('startQ').onclick = () => {
  const p = +$('price').value;
  if (!p || p <= 0){ $('price').focus(); return; }
  const prev = item.prev;
  item = {name: $('itemName').value.trim() || 'هذا الشيء', price: p, prev};
  answers = prev ? migrate(prev) : new Array(QS.length).fill(null);
  cur = 0; renderQ(); show('s-q');
};

// الأسئلة
const useIdx = QS.findIndex(q => q.id === 'use');
// قرارات قديمة (12 سؤالاً): سؤال المدة لم يكن موجوداً، وخيار "أسبوعياً" كان الأول
function migrate(a){
  a = a.slice();
  if (a.length === 12){ if (a[useIdx] !== null) a[useIdx] += 1; a.splice(useIdx + 1, 0, null); }
  return a;
}
function renderQ(){
  const q = QS[cur];
  renderJourney(q.g);
  const card = $('qCard'); card.classList.remove('qcard'); void card.offsetWidth; card.classList.add('qcard');
  $('qCount').innerHTML = 'السؤال ' + iso(cur+1) + ' من ' + iso(QS.length);
  $('qItem').innerHTML = esc(item.name) + ' · ' + fmt(item.price) + ' دج';
  $('qGate').textContent = 'بوابة ' + GATES[q.g].name;
  $('qText').textContent = q.t;
  let info = '';
  if (q.info === 'hours'){
    info = '<div class="info">يكلّفك <b>' + hoursText() + '</b> من العمل، أي <b>' +
      pct(item.price/profile.income*100) + '</b> من دخلك الشهري.</div>';
  }
  if (q.info === 'use'){
    const u = QS[useIdx].o[answers[useIdx]];
    info = '<div class="info">تستعمله <b>' + u[0] + '</b>. بجانب كل مدة: تكلفة الاستعمال الواحد.</div>';
  }
  $('qInfo').innerHTML = info;
  const box = $('qOpts'); box.innerHTML = '';
  q.o.forEach((o,i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'opt' + (answers[cur]===i ? ' sel' : '');
    if (q.info === 'use'){
      const u = QS[useIdx].o[answers[useIdx]];
      b.innerHTML = o[0] + '<span class="cost">' + fmt(item.price/(u[3]*o[3])) + ' دج</span>';
    } else b.textContent = o[0];
    b.onclick = () => { answers[cur] = i; b.classList.add('sel'); setTimeout(next, 180); };
    box.appendChild(b);
  });
  $('backQ').textContent = cur === 0 ? 'رجوع' : 'السابق';
}
function renderJourney(g){
  document.querySelectorAll('#journey .node').forEach((n,i) => {
    n.classList.toggle('done', i < g); n.classList.toggle('now', i === g);
  });
  $('jFill').style.width = 'calc((100% - 44px) * ' + (g/3) + ')';
  const inGate = QS.map((q,i)=>i).filter(i => QS[i].g === g);
  $('steps').innerHTML = inGate.map(i => '<i class="' + (i === cur ? 'cur' : (answers[i] !== null && i < cur ? 'on' : '')) + '"></i>').join('');
}
const CHEERS = ['🎯 اجتزت بوابة الحاجة','💰 اجتزت بوابة القدرة','⚖️ اجتزت بوابة القيمة'];
function next(){
  if (cur < QS.length-1){
    const before = QS[cur].g; cur++;
    if (QS[cur].g !== before) toast(CHEERS[before]);
    renderQ();
  } else result();
}
$('backQ').onclick = () => { if (cur === 0) show('s-item'); else { cur--; renderQ(); } };

// النتيجة
function result(){
  const gs = [0,0,0,0]; let total = 0, knock = '';
  QS.forEach((q,i) => { const o = q.o[answers[i]]; gs[q.g] += o[1]; total += o[1]; });
  const ans = id => { const i = QS.findIndex(q=>q.id===id); return QS[i].o[answers[i]]; };
  if (ans('cash')[2]) knock = 'لا تستطيع دفعه نقداً دون مس الادخار أو الاستدانة.';
  else if (ans('need')[1] === 0 && ans('search')[1] === 0) knock = 'لا يحل مشكلة حقيقية ولم تكن تبحث عنه.';

  let v;
  if (knock || total < 50) v = {c:'v-no', ic:'❌', t:'لا تشترِ', k:'no'};
  else if (total >= 75) v = {c:'v-ok', ic:'✅', t:'اشترِ بثقة', k:'ok'};
  else v = {c:'v-wait', ic:'⏳', t:'أجّل 30 يوماً', k:'wait'};

  $('verdict').className = 'verdict ' + v.c;
  $('verdict').innerHTML = '<div class="ic">' + v.ic + '</div><h2>' + v.t + '</h2>' +
    '<div class="score">' + esc(item.name) + ' · ' + ratio(total, 100) + '</div>' +
    (knock ? '<p class="reason" style="margin:10px 0 0">⛔ ' + knock + '</p>' : '');

  const uses = ans('use')[3] * ans('life')[3];
  $('facts').innerHTML =
    '<div><b>' + hoursText() + '</b><small>من العمل</small></div>' +
    '<div><b>' + pct(item.price/profile.income*100) + '</b><small>من الدخل الشهري</small></div>' +
    '<div><b>' + fmt(item.price/uses) + ' دج</b><small>للاستعمال الواحد</small></div>';

  let weakest = 0, weakRatio = 2;
  $('gates').innerHTML = GATES.map((g,i) => {
    const r = gs[i]/g.max;
    if (r < weakRatio){ weakRatio = r; weakest = i; }
    const col = r >= .75 ? 'var(--ok)' : r >= .5 ? 'var(--wait)' : 'var(--no)';
    return '<div class="g-row"><div class="top"><span>' + g.name + '</span><b>' + ratio(gs[i], g.max) +
      '</b></div><div class="bar"><i style="width:' + (r*100) + '%;background:' + col + '"></i></div></div>';
  }).join('');
  $('tip').textContent = (v.k === 'ok' && weakRatio >= .75)
    ? 'قرار متوازن في كل البوابات. اشترِ وتابع استعماله كما توقعت.'
    : TIPS[weakest];

  const hist = store.get('qarar_hist', []);
  const rec = {id: editId || Date.now(), n:item.name, p:item.price, s:total, k:v.k, a:answers.slice(), d:new Date().toISOString().slice(0,10)};
  const at = editId ? hist.findIndex(h => h.id === editId) : -1;
  if (at >= 0){ rec.e = 1; hist.splice(at, 1); }
  hist.unshift(rec);
  if (at >= 0) setTimeout(() => toast('✏️ تم تحديث القرار'), 300);
  editId = null;
  store.set('qarar_hist', hist.slice(0,50));
  show('s-res');
}
$('again').onclick = () => goItem();

// السجل
const TAGS = {ok:['اشترِ','v-ok'], wait:['أجّل','v-wait'], no:['لا تشترِ','v-no']};
$('histBtn').onclick = () => {
  const cur = document.querySelector('.screen.on');
  if (cur && cur.id !== 's-hist') prevScreen = cur.id;
  const hist = store.get('qarar_hist', []);
  let fixed = false;
  hist.forEach((h,i) => { if (!h.id){ h.id = Date.now() - i - 1; fixed = true; } });
  if (fixed) store.set('qarar_hist', hist);
  $('histList').innerHTML = hist.length ? hist.map(h => {
    let extra = '';
    if (h.k === 'wait'){
      const days = 30 - Math.floor((Date.now() - new Date(h.d)) / 864e5);
      extra = days > 0 ? ' · بقي ' + iso(days) + ' يوماً' : ' · حان وقت المراجعة';
    }
    return '<li><span><b>' + esc(h.n) + '</b>' + (h.e ? ' <small style="color:var(--muted)">(معدّل)</small>' : '') +
      '<br><small style="color:var(--muted)">' + fmt(h.p) + ' دج · ' + iso(h.d) + extra +
      '</small></span><span class="acts"><span class="tag ' + TAGS[h.k][1] + '">' + TAGS[h.k][0] + ' ' + iso(h.s) +
      '</span><button class="ed" type="button" data-id="' + h.id + '">✏️ تعديل</button></span></li>';
  }).join('') : '<p class="empty">لا توجد قرارات بعد.</p>';
  show('s-hist');
};
$('histList').onclick = e => {
  const b = e.target.closest('.ed'); if (!b) return;
  const h = store.get('qarar_hist', []).find(x => String(x.id) === b.dataset.id);
  if (h) goItem(h);
};
$('closeHist').onclick = () => show(profile ? prevScreen : 's-income');
$('clearHist').onclick = () => { if (confirm('مسح كل السجل؟')){ store.set('qarar_hist', []); $('histBtn').onclick(); } };

// البداية
if (profile) goItem(); else initIncome();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
